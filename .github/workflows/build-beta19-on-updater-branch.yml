name: Test and host beta19 companion input fix on update-channel3
on:
  push:
    branches: [update-channel3]
    paths: [android/release/beta19-branch-signatures.json, .github/workflows/build-beta19-on-updater-branch.yml]
permissions:
  contents: write
jobs:
  build-test-host:
    if: github.repository_id == '1424927008'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Verify the exact beta18 baseline from the updater branch
        run: |
          set -euo pipefail
          mkdir -p work/base work/unsigned work/signed work/libs work/classes work/test work/reports
          sdkmanager 'build-tools;36.0.0' 'platforms;android-36'
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          archive=Path('builds/beta18/ReRAC-Android-beta18.apk.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='79942e900551d89555dfd8f8d7a7d26525dcc6b30fd033747a2af0327538aa56'
          with zipfile.ZipFile(archive) as z:
              assert z.namelist()==['ReRAC.apk']
              data=z.read('ReRAC.apk')
          assert hashlib.sha256(data).hexdigest()=='4239609e07bb09a727f254f461ad4c87b2ecbd03907ce652fced6089ef9d30cb'
          Path('work/base/beta18.apk').write_bytes(data)
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs work/base/beta18.apk | grep -F '57188113b5796632a7d4db37622abf7c4d2fb3d9b0bccdc9830b01560ee0f81e'
      - name: Test contact selection, branch policy and bounded archive extraction
        run: |
          set -euo pipefail
          curl -fsSL https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o work/libs/junit.jar
          curl -fsSL https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o work/libs/hamcrest.jar
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o work/libs/json.jar
          javac -encoding UTF-8 --release 8 -classpath "work/libs/*:$ANDROID_HOME/platforms/android-36/android.jar" -d work/classes $(find android/launcher/android/src -name '*.java') android/launcher/android/tests/org/rerac/android/{QuickSelectModelTest,UpdatePolicyTest,UpdateArchiveTest}.java
          java -classpath "work/classes:work/libs/*:$ANDROID_HOME/platforms/android-36/android.jar" org.junit.runner.JUnitCore org.rerac.android.QuickSelectModelTest org.rerac.android.UpdatePolicyTest org.rerac.android.UpdateArchiveTest | tee work/reports/unit-tests.txt
      - name: Rebuild beta19 and apply the offline-approved public signing block
        run: |
          set -euo pipefail
          python3 android/release/build_branch_beta19.py --baseline work/base/beta18.apk --sdk "$ANDROID_HOME" --output work/unsigned
          python3 android/release/prepare_branch_beta19.py --unsigned work/unsigned --output work/signed --tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Prepare matching disposable keys for APK instrumentation
        run: |
          set -euo pipefail
          keydir="$RUNNER_TEMP/companion-contact-key"
          mkdir -m 700 "$keydir"
          python3 -c 'import secrets,sys;open(sys.argv[1],"w").write(secrets.token_hex(24))' "$keydir/password"
          keytool -genkeypair -noprompt -keystore "$keydir/test.p12" -storetype PKCS12 -storepass:file "$keydir/password" -alias ui -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Disposable Companion Contact Test'
          python3 android/release/build_companion_ui_test.py --sdk "$ANDROID_HOME" --output work/test/test-unsigned.apk
          for pair in 'work/base/beta18.apk work/test/base.apk' 'work/signed/ReRAC-Android-beta19.apk work/test/app.apk' 'work/test/test-unsigned.apk work/test/test.apk'; do
            read -r source target <<< "$pair"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --alignment-preserved --ks "$keydir/test.p12" --ks-type PKCS12 --ks-pass file:"$keydir/password" --v4-signing-enabled false --out "$target" "$source"
          done
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce the dropped wheel tap on beta18 and verify beta19 input
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none
          script: |
            adb install work/test/base.apk
            adb install work/test/test.apk
            adb shell am instrument -w -r -e regression_only baseline org.rerac.tests.companion/org.rerac.tests.CompanionUiInstrumentation | tee work/reports/beta18-regression.txt
            grep -q '"stale_map_baseline_drops_wheel":true' work/reports/beta18-regression.txt
            adb install -r work/test/app.apk
            adb shell am instrument -w -r -e regression_only fixed org.rerac.tests.companion/org.rerac.tests.CompanionUiInstrumentation | tee work/reports/beta19-regression.txt
            grep -q '"stale_map_fixed":true' work/reports/beta19-regression.txt
            adb shell am instrument -w -r org.rerac.tests.companion/org.rerac.tests.CompanionUiInstrumentation | tee work/reports/beta19-companion.txt
            adb logcat -d > work/reports/logcat.txt
            grep -q '"system_routed_secondary_taps":16' work/reports/beta19-companion.txt
            grep -q '"contact_once_multitouch":true' work/reports/beta19-companion.txt
      - name: Commit the tested signed build directly to update-channel3
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/beta19/ReRAC-Android-beta19.apk.zip builds/beta19/build.json builds/beta19/SHA256SUMS.txt
          git commit -m 'Host tested beta19 companion contact-selection build on update-channel3'
          git push origin HEAD:update-channel3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta19-companion-input-proof
          path: work/reports
          retention-days: 14

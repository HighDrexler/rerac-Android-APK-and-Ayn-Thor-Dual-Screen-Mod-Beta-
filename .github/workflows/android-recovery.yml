name: Android recovery tools
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: [.github/workflows/android-recovery.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Recover public baseline and Android tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/tools recovery/inspection
          curl --fail --location --retry 3 'https://github.com/HighDrexler/rerac-Android-APK-and-Ayn-Thor-Dual-Screen-Mod-Beta-/releases/download/v1.0/ReRAC-Mobile-v1.0.zip' -o recovery/baseline.zip
          echo '327e92b042e135dba115f332104ee947978d6aca9b3a4fa56c8e48e29bf623cc  recovery/baseline.zip' | sha256sum -c -
          unzip -q recovery/baseline.zip -d recovery/baseline
          echo 'cb13360fc1796e2c1e9ef00029eacbb853bd8e966837140878bd65df55f3b477  recovery/baseline/ReRAC-Mobile-v16.apk' | sha256sum -c -
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager 'build-tools;36.0.0' 'platforms;android-36'
          cp -a "$sdk/build-tools/36.0.0" recovery/tools/build-tools
          cp "$sdk/platforms/android-36/android.jar" recovery/tools/android.jar
          curl --fail --location --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -o recovery/tools/apktool.jar
          java -jar recovery/tools/apktool.jar d -f --no-res recovery/baseline/ReRAC-Mobile-v16.apk -o recovery/decoded
          recovery/tools/build-tools/apksigner verify --verbose --print-certs recovery/baseline/ReRAC-Mobile-v16.apk > recovery/inspection/baseline-signature.txt
          recovery/tools/build-tools/aapt2 dump badging recovery/baseline/ReRAC-Mobile-v16.apk > recovery/inspection/baseline-package.txt
          cp -r recovery/decoded/smali* recovery/inspection/
          recovery/tools/build-tools/aapt2 dump xmltree --file AndroidManifest.xml recovery/baseline/ReRAC-Mobile-v16.apk > recovery/inspection/baseline-manifest.txt
          find recovery/tools -type f -print0 | sort -z | xargs -0 sha256sum > recovery/inspection/tool-checksums.txt
      - name: Retain recovery tools and disassembly (no game data, no signing keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-v16-recovery
          path: |
            recovery/tools
            recovery/inspection
          retention-days: 7

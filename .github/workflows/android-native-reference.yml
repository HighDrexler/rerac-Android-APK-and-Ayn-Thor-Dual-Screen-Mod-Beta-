name: Android native reconstruction reference
on:
  workflow_dispatch:
  push:
    branches: [integration/native-core-035]
    paths: [.github/workflows/android-native-reference.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          mkdir -p reference
          git archive --format=tar HEAD | gzip > reference/repository.tar.gz
          git rev-parse HEAD > reference/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-source-reference
          path: reference
          retention-days: 14
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Inspect original v16 without changing it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection/tools
          curl --fail --location --retry 3 'https://github.com/HighDrexler/rerac-Android-APK-and-Ayn-Thor-Dual-Screen-Mod-Beta-/releases/download/v1.0/ReRAC-Mobile-v1.0.zip' -o /tmp/v16.zip
          echo '327e92b042e135dba115f332104ee947978d6aca9b3a4fa56c8e48e29bf623cc  /tmp/v16.zip' | sha256sum -c -
          unzip -p /tmp/v16.zip ReRAC-Mobile-v16.apk > /tmp/v16.apk
          echo 'cb13360fc1796e2c1e9ef00029eacbb853bd8e966837140878bd65df55f3b477  /tmp/v16.apk' | sha256sum -c -
          curl --fail --location --retry 3 'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' -o /tmp/jadx.zip
          echo '545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974  /tmp/jadx.zip' | sha256sum -c -
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          set +e
          /tmp/jadx/bin/jadx --show-bad-code --no-res -d inspection/java /tmp/v16.apk > inspection/jadx.log 2>&1
          code=$?
          set -e
          echo "$code" > inspection/jadx-exit-code.txt
          test -s inspection/java/sources/org/rerac/android/GameActivity.java
          test -s inspection/java/sources/org/rerac/android/WeaponWheel.java
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager 'build-tools;36.0.0' 'platforms;android-36'
          cp -a "$sdk/build-tools/36.0.0" inspection/tools/build-tools
          cp "$sdk/platforms/android-36/android.jar" inspection/tools/android.jar
          inspection/tools/build-tools/aapt2 dump xmltree --file AndroidManifest.xml /tmp/v16.apk > inspection/manifest.txt
          inspection/tools/build-tools/aapt2 dump badging /tmp/v16.apk > inspection/package.txt
          for abi in arm64-v8a x86_64; do
            unzip -p /tmp/v16.apk lib/$abi/librc_engine.so > /tmp/engine.so
            readelf --dyn-syms --wide /tmp/engine.so > inspection/symbols-$abi.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-reference
          path: inspection
          retention-days: 14

name: Verify and host locally signed 1.1 on updater branch
on:
  push:
    branches: [update-channel3]
    paths: [android/release/branch-signatures.json, android/native/engine-build.json, .github/workflows/publish-branch.yml]
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      signed: ${{ steps.receipt.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - name: Choose staging or signed verification
        id: receipt
        run: |
          if test -f android/release/branch-signatures.json; then
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Require successful native jobs for the pinned source
        id: native
        if: steps.receipt.outputs.signed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          from pathlib import Path
          pin=json.loads(Path('android/native/engine-build.json').read_text())
          api=lambda p:json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+p]))
          run=api('/actions/runs/'+str(pin['run_id']))
          assert run['head_sha']==pin['source_sha'] and run['head_branch']=='update-channel3'
          names={'game-tests','native (arm64-v8a, aarch64-linux-android)','native (x86_64, x86_64-linux-android)'}
          for attempt in range(160):
              jobs=api('/actions/runs/'+str(pin['run_id'])+'/jobs')['jobs']
              selected=[j for j in jobs if j['name'] in names]
              assert len(selected)==3
              assert not any(j['status']=='completed' and j['conclusion']!='success' for j in selected), 'Required native/game job failed'
              if all(j['conclusion']=='success' for j in selected):break
              print('Waiting for the pinned native build jobs',flush=True);time.sleep(30)
          else:raise AssertionError('Native jobs did not complete')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('run_id='+str(pin['run_id'])+'\n')
          Path('work').mkdir(exist_ok=True)
          Path('work/verified-native-run.json').write_text(json.dumps(run,indent=2))
          PY
      - uses: actions/download-artifact@v4
        if: steps.receipt.outputs.signed == 'false'
        with:
          pattern: engine-*
          path: work/native
          run-id: ${{ steps.native.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v4
        if: steps.receipt.outputs.signed == 'false'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.receipt.outputs.signed == 'false'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Stage exact source-built candidate for local signing
        if: steps.receipt.outputs.signed == 'false'
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;36.0.0' 'platforms;android-36'
          mkdir -p work/base builds/1.1
          unzip -p builds/beta19r2/ReRAC-Android-beta19.apk.zip ReRAC.apk > work/base/beta19.apk
          source="$(python3 -c 'import json;print(json.load(open("android/native/engine-build.json"))["source_sha"])')"
          python3 android/release/build_branch.py --baseline work/base/beta19.apk --sdk "$ANDROID_HOME" --output work/candidate --arm64 work/native/engine-arm64-v8a/jniLibs/arm64-v8a/librc_engine.so --x86 work/native/engine-x86_64/jniLibs/x86_64/librc_engine.so --source "$source" --packaging-source "$GITHUB_SHA"
          python3 android/native/native_abi_gate.py work/candidate/launcher-unsigned.apk --require-source-companion --report work/candidate/abi.json
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          archive=Path('builds/1.1/signing-candidate.apk.zip')
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              z.write('work/candidate/launcher-unsigned.apk','unsigned.apk')
          assert archive.stat().st_size<100*1024*1024
          report=json.loads(Path('work/candidate/launcher-unsigned.json').read_text())
          report.update(archive_sha256=hashlib.sha256(archive.read_bytes()).hexdigest(),archive_bytes=archive.stat().st_size)
          Path('builds/1.1/signing-candidate.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/1.1/signing-candidate.apk.zip builds/1.1/signing-candidate.json
          git commit -m 'Stage source-built launcher 1.1 for local signing'
          git push origin HEAD:update-channel3
  verify-host:
    needs: stage
    if: needs.stage.outputs.signed == 'true' && github.repository_id == '1424927008'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Verify the exact beta18 baseline from the updater branch
        run: |
          set -euo pipefail
          mkdir -p work/base work/unsigned work/signed work/libs work/classes work/test work/reports
          sdkmanager 'build-tools;36.0.0' 'platforms;android-36'
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          archive=Path('builds/beta18/ReRAC-Android-beta18.apk.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='79942e900551d89555dfd8f8d7a7d26525dcc6b30fd033747a2af0327538aa56'
          with zipfile.ZipFile(archive) as z:
              assert z.namelist()==['ReRAC.apk']
              data=z.read('ReRAC.apk')
          assert hashlib.sha256(data).hexdigest()=='4239609e07bb09a727f254f461ad4c87b2ecbd03907ce652fced6089ef9d30cb'
          Path('work/base/beta18.apk').write_bytes(data)
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs work/base/beta18.apk | grep -F '57188113b5796632a7d4db37622abf7c4d2fb3d9b0bccdc9830b01560ee0f81e'
      - name: Test contact selection, branch policy and bounded archive extraction
        run: |
          set -euo pipefail
          curl -fsSL https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o work/libs/junit.jar
          curl -fsSL https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o work/libs/hamcrest.jar
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o work/libs/json.jar
          javac -encoding UTF-8 --release 8 -classpath "work/libs/*:$ANDROID_HOME/platforms/android-36/android.jar" -d work/classes $(find android/launcher/android/src -name '*.java') android/launcher/android/tests/org/rerac/android/{QuickSelectModelTest,UpdatePolicyTest,UpdateArchiveTest}.java
          java -classpath "work/classes:work/libs/*:$ANDROID_HOME/platforms/android-36/android.jar" org.junit.runner.JUnitCore org.rerac.android.QuickSelectModelTest org.rerac.android.UpdatePolicyTest org.rerac.android.UpdateArchiveTest | tee work/reports/unit-tests.txt
      - name: Apply the local signing receipt and verify source-built engines
        run: |
          set -euo pipefail
          python3 android/release/prepare_branch.py --candidate builds/1.1/signing-candidate.apk.zip --output work/signed --tools "$ANDROID_HOME/build-tools/36.0.0"
          python3 android/native/native_abi_gate.py work/signed/ReRAC-Android-1.1.apk --require-source-companion --report work/reports/native-abi.json
      - name: Prepare matching disposable keys for APK instrumentation
        run: |
          set -euo pipefail
          keydir="$RUNNER_TEMP/companion-contact-key"
          mkdir -m 700 "$keydir"
          python3 -c 'import secrets,sys;open(sys.argv[1],"w").write(secrets.token_hex(24))' "$keydir/password"
          keytool -genkeypair -noprompt -keystore "$keydir/test.p12" -storetype PKCS12 -storepass:file "$keydir/password" -alias ui -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Disposable Companion Contact Test'
          python3 android/release/build_companion_ui_test.py --sdk "$ANDROID_HOME" --output work/test/test-unsigned.apk
          for pair in 'work/base/beta18.apk work/test/base.apk' 'work/signed/ReRAC-Android-1.1.apk work/test/app.apk' 'work/test/test-unsigned.apk work/test/test.apk'; do
            read -r source target <<< "$pair"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --alignment-preserved --ks "$keydir/test.p12" --ks-type PKCS12 --ks-pass file:"$keydir/password" --v4-signing-enabled false --out "$target" "$source"
          done
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify companion taps and native artwork composition
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none
          script: |
            adb install work/test/base.apk
            adb install work/test/test.apk
            adb shell am instrument -w -r -e regression_only baseline org.rerac.tests.companion/org.rerac.tests.CompanionUiInstrumentation | tee work/reports/beta18-regression.txt
            grep -q '"stale_map_baseline_drops_wheel":true' work/reports/beta18-regression.txt
            adb install -r work/test/app.apk
            adb shell am instrument -w -r -e regression_only fixed org.rerac.tests.companion/org.rerac.tests.CompanionUiInstrumentation | tee work/reports/1.1-regression.txt
            grep -q '"stale_map_fixed":true' work/reports/1.1-regression.txt
            adb shell am instrument -w -r org.rerac.tests.companion/org.rerac.tests.CompanionUiInstrumentation | tee work/reports/1.1-companion.txt
            adb logcat -d > work/reports/logcat.txt
            grep -q '"system_routed_secondary_taps":16' work/reports/1.1-companion.txt
            grep -q '"contact_once_multitouch":true' work/reports/1.1-companion.txt
            grep -q '"native_artwork_without_android_overlay":true' work/reports/1.1-companion.txt
      - name: Commit tested 1.1 directly to update-channel3
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/1.1/ReRAC-Android-1.1.apk.zip builds/1.1/build.json builds/1.1/SHA256SUMS.txt
          git rm builds/1.1/signing-candidate.apk.zip builds/1.1/signing-candidate.json
          git commit -m 'Host tested signed launcher 1.1 on update-channel3'
          git push origin HEAD:update-channel3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-1.1-companion-proof
          path: work/reports
          retention-days: 14

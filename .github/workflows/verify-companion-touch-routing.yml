name: Verify companion touchscreen routing on updater-branch APK
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-touch-routing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secondary-touch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Verify current branch APK and prepare disposable emulator fixtures
        run: |
          set -euo pipefail
          mkdir -p work/test work/reports
          sdkmanager 'build-tools;36.0.0' 'platforms;android-36'
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          archive=Path('builds/beta18/ReRAC-Android-beta18.apk.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='79942e900551d89555dfd8f8d7a7d26525dcc6b30fd033747a2af0327538aa56'
          with zipfile.ZipFile(archive) as z:
              assert z.namelist()==['ReRAC.apk']
              apk=z.read('ReRAC.apk')
          assert hashlib.sha256(apk).hexdigest()=='4239609e07bb09a727f254f461ad4c87b2ecbd03907ce652fced6089ef9d30cb'
          Path('work/test/baseline.apk').write_bytes(apk)
          with zipfile.ZipFile(Path('work/test/baseline.apk')) as z:
              meta=json.loads(z.read('assets/rerac-build.json'))
              assert meta['version_code']==34 and meta['native_source_sha']=='0ab6c9ca4be8d2f8f671a457c069a5f181e6d9da'
              assert {n:hashlib.sha256(z.read(n)).hexdigest() for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')}==meta['native_sha256']
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs work/test/baseline.apk | tee work/reports/baseline-signature.txt
          grep -q '57188113b5796632a7d4db37622abf7c4d2fb3d9b0bccdc9830b01560ee0f81e' work/reports/baseline-signature.txt
          python3 android/release/build_companion_ui_test.py --sdk "$ANDROID_HOME" --output work/test/test-unsigned.apk
          keydir="$RUNNER_TEMP/companion-touch-key"
          mkdir -m 700 "$keydir"
          python3 -c 'import secrets,sys;open(sys.argv[1],"w").write(secrets.token_hex(24))' "$keydir/password"
          keytool -genkeypair -noprompt -keystore "$keydir/test.p12" -storetype PKCS12 -storepass:file "$keydir/password" -alias ui -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Disposable Companion Routing Test'
          for pair in 'baseline app' 'test-unsigned test'; do
            read -r source target <<< "$pair"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --alignment-preserved --ks "$keydir/test.p12" --ks-type PKCS12 --ks-pass file:"$keydir/password" --v4-signing-enabled false --out "work/test/$target.apk" "work/test/$source.apk"
          done
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Inject touchscreen taps through the secondary window
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none
          script: |
            adb install work/test/app.apk
            adb install work/test/test.apk
            adb shell am instrument -w -r org.rerac.tests.companion/org.rerac.tests.CompanionUiInstrumentation | tee work/reports/companion-routing.txt
            adb logcat -d > work/reports/logcat.txt
            grep -q '"system_routed_secondary_taps":16' work/reports/companion-routing.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-touch-routing-evidence
          path: work/reports
          retention-days: 14

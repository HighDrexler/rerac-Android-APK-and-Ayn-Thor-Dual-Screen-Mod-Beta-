name: Android launcher candidate
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - android/launcher/**
      - android/recovery/source-chunks/**
      - .github/workflows/android-launcher.yml
permissions:
  contents: read
concurrency:
  group: android-launcher-dev
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore editable recovered source when bootstrapping
        shell: bash
        run: |
          set -euo pipefail
          if [ -d android/recovery/source-chunks ]; then
            python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          parts = sorted(Path('android/recovery/source-chunks').glob('*.b64'))
          assert len(parts) == 9
          blob = base64.b64decode(''.join(p.read_text() for p in parts), validate=True)
          assert hashlib.sha256(blob).hexdigest() == '7721b6e54afe07216b10836e77ec09ec1a26e71c807d5829b5b101c26b663000'
          files = json.loads(lzma.decompress(blob))
          root = Path('android/launcher').resolve()
          for name, content in files.items():
              target = (root / name).resolve()
              assert target.is_relative_to(root) and not target.exists(), name
              assert not name.endswith(('.apk', '.p12', '.jks', '.keystore')) and 'password' not in name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')
          print('Restored', len(files), 'editable source/test files. No native game data or signing keys.')
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add android/launcher
            git rm -r android/recovery/source-chunks
            git commit -m 'Restore editable Android launcher 1.1 sources, tests and pinned v16 build path'
            git push origin HEAD:dev
          fi
      - name: Require editable source
        run: test -f android/launcher/tools/android/build_launcher.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: android/launcher/pom.xml
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare pinned baseline and SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/tools work/output
          sdkmanager 'build-tools;36.0.0' 'platforms;android-36'
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ln -s "$sdk/build-tools/36.0.0" work/tools/build-tools
          ln -s "$sdk/platforms/android-36/android.jar" work/tools/android.jar
          curl --fail --location --retry 3 'https://github.com/HighDrexler/rerac-Android-APK-and-Ayn-Thor-Dual-Screen-Mod-Beta-/releases/download/v1.0/ReRAC-Mobile-v1.0.zip' -o work/baseline.zip
          echo '327e92b042e135dba115f332104ee947978d6aca9b3a4fa56c8e48e29bf623cc  work/baseline.zip' | sha256sum -c -
          unzip -q work/baseline.zip -d work/baseline
      - name: Policy, persistence and launcher regression tests
        run: mvn -B -f android/launcher/pom.xml test
      - name: Build unsigned launcher candidates (native core remains v16)
        shell: bash
        run: |
          set -euo pipefail
          for pair in '1.1.0-beta.1 17' '1.1.0-beta.2 18'; do
            read -r version code <<< "$pair"
            python android/launcher/tools/android/build_launcher.py --baseline work/baseline/ReRAC-Mobile-v16.apk --tools work/tools --output "work/output/ReRAC-Launcher-$version-unsigned.apk" --version "$version" --code "$code"
          done
          git rev-parse HEAD > work/output/source-commit.txt
          echo 'Unsigned candidates only. ReRAC core remains 0.3.4/v16. No Stable release or update channel is changed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain candidates and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-1.1-candidates
          path: |
            work/output
            android/launcher/target/surefire-reports
          retention-days: 14

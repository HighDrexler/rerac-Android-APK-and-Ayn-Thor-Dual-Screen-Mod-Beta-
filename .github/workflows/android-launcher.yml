name: Android launcher candidate
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - android/launcher/**
      - android/release/launcher-build.json
      - .github/workflows/android-launcher.yml
permissions:
  contents: read
concurrency:
  group: android-launcher-dev
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require recovered editable source and explicit candidate identity
        run: |
          test -f android/launcher/tools/android/build_launcher.py
          test -f android/release/launcher-build.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: android/launcher/pom.xml
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare pinned baseline and SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/tools work/output
          sdkmanager 'build-tools;36.0.0' 'platforms;android-36'
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ln -s "$sdk/build-tools/36.0.0" work/tools/build-tools
          ln -s "$sdk/platforms/android-36/android.jar" work/tools/android.jar
          curl --fail --location --retry 3 'https://github.com/HighDrexler/rerac-Android-APK-and-Ayn-Thor-Dual-Screen-Mod-Beta-/releases/download/v1.0/ReRAC-Mobile-v1.0.zip' -o work/baseline.zip
          echo '327e92b042e135dba115f332104ee947978d6aca9b3a4fa56c8e48e29bf623cc  work/baseline.zip' | sha256sum -c -
          unzip -q work/baseline.zip -d work/baseline
      - name: Policy, persistence and launcher regression tests
        run: mvn -B -f android/launcher/pom.xml test
      - name: Build configured unsigned candidate; refuse a false native-core label
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,subprocess,sys,zipfile
          from pathlib import Path
          tools=Path('android/launcher/tools/android').resolve();sys.path.insert(0,str(tools))
          import build_launcher
          config=json.loads(Path('android/release/launcher-build.json').read_text())
          assert config['schema']==1
          version=config['launcher_version'];code=config['version_code']
          assert isinstance(version,str) and re.fullmatch(r'1\.1\.\d+(?:-[A-Za-z0-9.]+)?',version)
          assert type(code) is int and 16<code<=2100000000
          assert config['core_version']==build_launcher.CORE=='0.3.4','Native port must be rebuilt before advertising 0.3.5'
          output=Path('work/output')/f'ReRAC-Launcher-{version}-unsigned.apk'
          subprocess.run([sys.executable,str(tools/'build_launcher.py'),'--baseline','work/baseline/ReRAC-Mobile-v16.apk','--tools','work/tools','--output',str(output),'--version',version,'--code',str(code)],check=True)
          with zipfile.ZipFile(output) as z:
              meta=json.loads(z.read('assets/rerac-build.json'))
              assert meta['core_version']==config['core_version'] and meta['version_code']==code and not meta['native_source_rebuild']
          Path('work/output/launcher-build.json').write_text(json.dumps(config,indent=2)+'\n')
          PY
          git rev-parse HEAD > work/output/source-commit.txt
          echo 'Unsigned candidate only. Original native core remains 0.3.4/v16. Signing, tested release publication and signed channel promotion remain separate gates.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain candidate and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-1.1-candidates
          path: |
            work/output
            android/launcher/target/surefire-reports
            android/launcher/target/theme-renders
          retention-days: 14

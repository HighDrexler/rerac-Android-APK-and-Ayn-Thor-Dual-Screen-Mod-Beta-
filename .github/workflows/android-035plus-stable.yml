name: Promote official ReRAC Android release to Stable
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed Development release e.g. rerac-android-0.3.6-dev.1
        required: true
        type: string
      thor_acceptance:
        description: Type THOR-PASSED after physical game, saves, cutscenes and second-screen verification
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: rerac-android-stable-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      THOR_ACCEPTANCE: ${{ inputs.thor_acceptance }}
      KEYSTORE_B64: ${{ secrets.RERAC_035_KEYSTORE_B64 }}
      RERAC_KEY_PASSWORD: ${{ secrets.RERAC_035_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/native-core-035
          persist-credentials: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Validate official newer upstream engine and signed APK
        shell: bash
        run: |
          set -euo pipefail
          [[ "$THOR_ACCEPTANCE" == "THOR-PASSED" ]] || { echo "::error::Physical AYN Thor gameplay acceptance missing"; exit 1; }
          [[ "$RELEASE_TAG" =~ ^rerac-android-[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]
          [[ -n "$KEYSTORE_B64" && -n "$RERAC_KEY_PASSWORD" ]] || { echo "::error::Release signing secrets unavailable"; exit 1; }
          mkdir -p work
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" = "true"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir work
          test "$(find work -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          sdkmanager 'build-tools;36.0.0'
          apk="$(find work -maxdepth 1 -name '*.apk')"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > work/cert.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: e2253eb7370c495ef0265efcdbe6bfbe09832070558fe9ed7047e7a2361ad75e' work/cert.txt
          gh api "repos/$GITHUB_REPOSITORY/contents/development.json?ref=update-channel2" --jq '.content' | tr -d '\n' | base64 -d > work/dev.json
          gh api "repos/$GITHUB_REPOSITORY/contents/stable.json?ref=update-channel2" --jq '.content' | tr -d '\n' | base64 -d > work/old-stable.json
          python3 - <<'PY'
          import os,json,base64,hashlib,zipfile,subprocess
          from pathlib import Path
          apk=next(Path('work').glob('*.apk'))
          with zipfile.ZipFile(apk) as z: meta=json.loads(z.read('assets/rerac-build.json'))
          assert meta['native_source_rebuild'] is True and meta['parallel_install'] is True
          assert meta['package_id']=='org.rerac.android.ui035test'
          assert meta['signer_sha256']=='e2253eb7370c495ef0265efcdbe6bfbe09832070558fe9ed7047e7a2361ad75e'
          tag=os.environ['RELEASE_TAG']
          assert tag.split('-')[2]==meta['core_version']
          dev=json.loads(base64.b64decode(json.loads(Path('work/dev.json').read_text())['payload']))
          assert dev['channel']=='development' and dev['schema']==1
          release=dev['release']
          assert release is not None and release['core_version']==meta['core_version']
          assert release['version_code']==meta['version_code'] and release['launcher_version']==meta['launcher_version']
          assert release['bytes']==apk.stat().st_size
          assert release['sha256']==hashlib.sha256(apk.read_bytes()).hexdigest()
          assert release['apk_url'].endswith('/'+tag+'/'+apk.name)
          old=json.loads(base64.b64decode(json.loads(Path('work/old-stable.json').read_text())['payload']))
          assert old['channel']=='stable' and old['schema']==1
          if old['release'] is not None:
              version=lambda v: tuple(map(int,v.split('.')))
              assert version(meta['core_version'])>version(old['release']['core_version']), 'Only NEW upstream releases are stable'
              assert meta['version_code']>old['release']['version_code']
          official=json.loads(subprocess.check_output(['gh','api','repos/re-rac/rerac/commits/'+meta['upstream_sha']]))
          assert official['commit']['message'].splitlines()[0].startswith('Release v'+meta['core_version'])
          Path('work/receipt.json').write_text(json.dumps({'upstream':meta['upstream_sha'],'core_version':meta['core_version'],'apk_sha256':release['sha256'],'physical_acceptance':'THOR-PASSED'},indent=2)+'\n')
          PY
      - name: Generate RSA-signed Stable envelope with same private certificate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-cryptography > /dev/null
          key="$RUNNER_TEMP/rerac-stable-private.p12"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$key"
          apk="$(find work -maxdepth 1 -name '*.apk')"
          python3 android/release/sign_035_feed.py --apk "$apk" --keystore "$key" --password-env RERAC_KEY_PASSWORD --release-tag "$RELEASE_TAG" --channel stable --output work/stable.json
          rm "$key"
      - name: Publish Stable channel only; preserve Development and original app
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/stable.json?ref=update-channel2" --jq '.sha')"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/stable.json" \
            -f branch=update-channel2 -f "sha=$sha" \
            -f "message=Promote validated official ReRAC Android $RELEASE_TAG to Stable" \
            -f "content=$(base64 -w0 work/stable.json)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rerac-android-stable-promotion-receipt
          path: |
            work/receipt.json
            work/cert.txt
            work/stable.json
          retention-days: 30
          if-no-files-found: warn

name: Beta8 FMV regression and signing readiness
on:
  push:
    branches: ['beta8/**']
    paths:
      - crates/**
      - .github/workflows/beta8-validation.yml
permissions:
  contents: read
concurrency:
  group: beta8-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signing-readiness:
    runs-on: ubuntu-24.04
    steps:
      - name: Check presence only of the established beta7 signing secrets
        env:
          RERAC_KEY_B64: ${{ secrets.RERAC_035_KEYSTORE_B64 }}
          RERAC_KEY_PASSWORD: ${{ secrets.RERAC_035_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RERAC_KEY_B64" || -z "$RERAC_KEY_PASSWORD" ]]; then
            echo "::error::Beta8 release blocked: original signing secrets RERAC_035_KEYSTORE_B64 and/or RERAC_035_KEYSTORE_PASSWORD are not configured. No key was read, generated or substituted."
            exit 1
          fi
          echo "Established signing secret fields are configured. Certificate identity remains a mandatory publisher check."
  engine-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the existing CI compiler and engine prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev clang lld pkg-config
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: beta8-engine-headless
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Run actual engine movie-camera and probe-pacing regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cargo test --locked -p rc-engine --lib movie_render::tests -- --nocapture 2>&1 | tee out/movie-engine-tests.log
          cargo test --locked -p rc-engine --lib frame_pace::tests -- --nocapture 2>&1 | tee out/frame-pace-tests.log
          git diff --check
          git rev-parse HEAD > out/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta8-engine-regressions
          path: out
          if-no-files-found: warn

name: Android native ABI compatibility
on:
  workflow_dispatch:
    inputs:
      candidate_release:
        description: 'Optional release tag containing exactly one Android APK (empty tests original v16)'
        required: false
        type: string
  push:
    branches: [dev]
    paths:
      - 'android/native/native_abi_gate.py'
      - 'android/native/v16-abi.json'
      - '.github/workflows/android-native-abi.yml'
permissions:
  contents: read
jobs:
  native-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ELF introspection tools
        run: sudo apt-get update && sudo apt-get install -y binutils unzip
      - name: Verify checksum-pinned original v16
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output v16.zip 'https://github.com/HighDrexler/rerac-Android-APK-and-Ayn-Thor-Dual-Screen-Mod-Beta-/releases/download/v1.0/ReRAC-Mobile-v1.0.zip'
          echo '327e92b042e135dba115f332104ee947978d6aca9b3a4fa56c8e48e29bf623cc  v16.zip' | sha256sum -c
          unzip -p v16.zip ReRAC-Mobile-v16.apk > baseline.apk
          python3 android/native/native_abi_gate.py baseline.apk --baseline android/native/v16-abi.json --report baseline-abi-report.json
      - name: Verify optional staged candidate
        if: inputs.candidate_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.candidate_release }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,100}$ ]]; then echo "Invalid tag" >&2; exit 1; fi
          mkdir candidate
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir candidate
          test "$(find candidate -maxdepth 1 -name '*.apk' -type f | wc -l)" -eq 1
          python3 android/native/native_abi_gate.py candidate/*.apk --baseline android/native/v16-abi.json --report candidate-abi-report.json
      - name: Attach reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-abi
          path: '*-abi-report.json'
          if-no-files-found: warn

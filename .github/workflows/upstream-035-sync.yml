name: Integrate upstream ReRAC 0.3.5

on:
  workflow_dispatch:
  push:
    branches:
      - integration/upstream-0.3.5
    paths:
      - .github/workflows/upstream-035-sync.yml

permissions:
  contents: write

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch pinned upstream v0.3.5
        run: |
          git remote add rerac-upstream https://github.com/re-rac/rerac.git
          git fetch --no-tags rerac-upstream 756ff56ba0ef72b9fa94e91e7bdc3623fe286be0

      - name: Attempt merge without changing the release branch
        id: merge
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge --no-commit --no-ff FETCH_HEAD; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat > /tmp/merge-stat.txt
            git commit -m "Integrate upstream ReRAC v0.3.5-alpha"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            git merge --abort || true
          fi

      - name: Report merge conflicts
        if: steps.merge.outputs.clean == 'false'
        run: |
          echo "### Upstream merge requires manual conflict resolution" >> "$GITHUB_STEP_SUMMARY"
          echo 'Conflict files:' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/conflicts.txt >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"

      # Match the Linux build prerequisites in upstream's release.yml.
      # Bevy needs the native Wayland, audio, input, and keyboard headers at compile time.
      - name: Install Linux build dependencies
        if: steps.merge.outputs.clean == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Cache Rust compilation
        if: steps.merge.outputs.clean == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Validate Rust workspace
        if: steps.merge.outputs.clean == 'true'
        run: cargo xtask test-quick

      - name: Push successfully tested source merge
        if: steps.merge.outputs.clean == 'true'
        run: git push origin HEAD:integration/upstream-0.3.5

      - name: Report Android validation requirement
        if: steps.merge.outputs.clean == 'true'
        run: |
          echo "### Source integrated into staging branch" >> "$GITHUB_STEP_SUMMARY"
          echo "Rust quick tests passed. Android APK, JNI, touch controls, dual-screen and device regression tests are **not** validated by this workflow." >> "$GITHUB_STEP_SUMMARY"
          echo "Do not promote this branch to release until those tests pass." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail clearly on unresolved conflicts
        if: steps.merge.outputs.clean == 'false'
        run: exit 1

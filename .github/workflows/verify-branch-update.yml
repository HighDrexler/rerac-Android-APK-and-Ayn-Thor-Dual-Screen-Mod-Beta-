name: Verify actual branch update to launcher 1.1
on:
  push:
    branches: [update-channel3]
    paths: [development.json]
permissions:
  contents: read
jobs:
  branch-update:
    if: github.repository_id == '1424927008'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: v1_1
            apk: ReRAC-Android-1.1.apk.zip
            code: 37
            sha: 4f08bbdd6027d0a440c4b0fcec9221f345dc14f0cea84dde07e59e04e4694944
    env:
      BASELINE: builds/${{ matrix.folder }}/${{ matrix.apk }}
      BASE_SHA: ${{ matrix.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Verify installed-build baseline and hosted 1.1 archive
        run: |
          set -euo pipefail
          mkdir -p work/fixture work/reports work/download
          python3 - <<'PY'
          import hashlib,json,os,urllib.request,zipfile
          from pathlib import Path
          with zipfile.ZipFile(os.environ['BASELINE']) as z:
              data=z.read('ReRAC.apk')
          assert hashlib.sha256(data).hexdigest()==os.environ['BASE_SHA']
          Path('work/fixture/beta18.apk').write_bytes(data)
          report=json.loads(Path('builds/v1_1_r2/build.json').read_text())
          assert report['version_code']==38 and report['launcher_version']=='1.1'
          assert report['apk_url']=='https://raw.githubusercontent.com/HighDrexler/rerac-Android-APK-and-Ayn-Thor-Dual-Screen-Mod-Beta-/update-channel3/builds/v1_1_r2/ReRAC-Android-1.1.apk.zip'
          archive=urllib.request.urlopen(report['apk_url'],timeout=120).read()
          assert len(archive)==report['archive_bytes'] and hashlib.sha256(archive).hexdigest()==report['archive_sha256']
          Path('work/download/beta19.zip').write_bytes(archive)
          with zipfile.ZipFile('work/download/beta19.zip') as z:
              assert z.namelist()==['ReRAC.apk']
              assert hashlib.sha256(z.read('ReRAC.apk')).hexdigest()==report['sha256']
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download and install 1.1 through the actual installed updater
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none
          script: python android/release/experimental_live_update_test.py --apk work/fixture/beta18.apk --output work/reports --initial-code ${{ matrix.code }} --target-code 38 --target-version 1.1 --target-sha256 "$(python -c 'import json; print(json.load(open("builds/v1_1_r2/build.json"))["sha256"])')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-1.1-upgrade-proof-${{ matrix.folder }}
          path: work/reports
          retention-days: 14


name: ReRAC 0.3.6 gameplay and Android compatibility acceptance
on:
  push:
    branches: [integration/upstream-036]
    paths: [.github/workflows/upstream-036-acceptance.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/upstream-036
          fetch-depth: 0
      - name: Enforce authentic upstream source and Android parity
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^version=//p' android/native/upstream.lock)" = "0.3.6"
          test "$(sed -n 's/^commit=//p' android/native/upstream.lock)" = "89c87e98f9d8296187df2a6310c67b32144090d3"
          git merge-base --is-ancestor 89c87e98f9d8296187df2a6310c67b32144090d3 HEAD
          python3 - <<'PY'
          import json,tomllib
          from pathlib import Path
          cfg=tomllib.loads(Path('Cargo.toml').read_text())
          assert cfg['workspace']['package']['version']=='0.3.6'
          candidate=json.loads(Path('android/native/candidate.json').read_text())
          assert candidate['version_code']==26
          assert candidate['launcher_version']=='1.1.0-beta.10'
          required=[
             'crates/rc-engine/src/android.rs',
             'crates/rc-engine/src/android/companion.rs',
             'crates/rc-engine/src/android/skip_policy.rs',
             'crates/rc-engine/src/audio_queue.rs',
             'crates/rc-engine/src/movie_render.rs',
             'crates/rc-video/src/movie_quality.rs'
          ]
          assert all(Path(p).exists() for p in required)
          # Avoid accidental loss of the prior beta.9 movie renderer and
          # Android-only accessibility/dual-display adapter.
          movie=Path(required[4]).read_text()
          assert 'remove_scanline_banding' in movie and 'ImageSampler::linear()' in movie
          assert 'cinematic_skip_pad' in movie
          assert 'companion_policy::display_mode' in Path(required[1]).read_text()
          print('PINNED_UPSTREAM_SOURCE_AND_ANDROID_FEATURES=PASS')
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          key: upstream036-gameplay
      - name: Test actual ReRAC 0.3.6 gameplay
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          cargo test --locked -p rc-game --lib 2>&1 | tee rc-game-tests.log
          cargo test --locked -p rc-video --lib 2>&1 | tee rc-video-tests.log
          for module in touch_input audio_queue movie_pipe; do
            rustc --edition=2021 --test "crates/rc-engine/src/$module.rs" -o "/tmp/$module-tests"
            "/tmp/$module-tests" | tee "$module-tests.log"
          done
          for policy in companion_policy skip_policy; do
            rustc --edition=2021 --test "crates/rc-engine/src/android/$policy.rs" -o "/tmp/$policy-tests"
            "/tmp/$policy-tests" | tee "$policy-tests.log"
          done
      - name: Store acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream036-gameplay-compatibility
          path: |
            *tests.log
          retention-days: 14
          if-no-files-found: warn

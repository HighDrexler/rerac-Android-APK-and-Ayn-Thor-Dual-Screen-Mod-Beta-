name: Android 0.3.5 parallel APK startup regression
on:
  workflow_dispatch:
  push:
    branches: [integration/native-core-035]
    paths: [.github/workflows/android-parallel-smoke.yml, android/release/parallel_package.py, android/release/sidecar-smoke.sh]
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Download the real source-built APK candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/candidate work/reports work/test
          gh run download 39350794010 --repo "$GITHUB_REPOSITORY" --name android-native-candidate --dir work/candidate
          sdkmanager 'build-tools;36.0.0'
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-cryptography > /dev/null
      - name: Reproduce sidecar packaging with a disposable signer
        shell: bash
        run: |
          set -euo pipefail
          keydir="$RUNNER_TEMP/sidecar-smoke-key"
          mkdir -m 700 "$keydir"
          python3 -c 'import secrets,sys; open(sys.argv[1],"w").write(secrets.token_hex(24))' "$keydir/password"
          chmod 600 "$keydir/password"
          keytool -genkeypair -noprompt -keystore "$keydir/test.p12" -storetype PKCS12 -storepass:file "$keydir/password" -alias preflight -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Disposable Sidecar Test'
          keytool -exportcert -keystore "$keydir/test.p12" -storetype PKCS12 -storepass:file "$keydir/password" -alias preflight -file "$keydir/cert.der"
          export KEYDIR="$keydir"
          python3 - <<'PY'
          import hashlib,os,sys,importlib.util
          from pathlib import Path
          module=Path('android/release/parallel_package.py')
          spec=importlib.util.spec_from_file_location('parallel_package',module)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          signer=hashlib.sha256((Path(os.environ['KEYDIR'])/'cert.der').read_bytes()).hexdigest()
          mod.EXPECTED_SIGNER=signer
          candidates=list(Path('work/candidate').rglob('ReRAC-Launcher-*-unsigned.apk'))
          assert len(candidates)==1
          report=mod.transform(candidates[0],Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0/zipalign',Path('work/test/unsigned.apk'),signer,version='1.1.0-beta.5',code=21)
          print('Reproduced sidecar APK',report['core_version'],report['bytes'])
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --alignment-preserved --ks "$keydir/test.p12" --ks-type PKCS12 --ks-key-alias preflight --ks-pass file:"$keydir/password" --v4-signing-enabled false --out work/test/sidecar.apk work/test/unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose work/test/sidecar.apk
          rm -f "$keydir/test.p12" "$keydir/password" "$keydir/cert.der"
          rmdir "$keydir"
      - name: Compile production-certificate DEX using D8, not binary patching
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,os
          from pathlib import Path
          path=Path('android/release/parallel_package.py')
          spec=importlib.util.spec_from_file_location('parallel_package',path)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          zipalign=Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0/zipalign'
          dex=mod.source_built_dex(mod.EXPECTED_SIGNER,zipalign)
          assert b'UpdateApkProvider' in dex
          Path('work/reports/production-launcher-classes6.dex').write_bytes(dex)
          print('Production launcher rebuilt with valid D8 string table:',len(dex),'bytes')
          PY
      - name: Enable disposable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actually install and launch the sidecar variant
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none
          script: bash android/release/sidecar-smoke.sh
      - name: Collect evidence, including failure cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-sidecar-smoke-evidence
          path: work/reports
          if-no-files-found: warn
          retention-days: 14

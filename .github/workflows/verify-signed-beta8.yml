name: Verify offline-signed beta8 and exact source artifacts
on:
  push:
    branches: ['beta8/fmv-rendering']
    paths: [.github/workflows/verify-signed-beta8.yml, android/release/verify_signed_beta8.py, android/release/beta8-public-approval.json, android/release/tests/test_verify_signed_beta8.py]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVAL_SHA256: 8c4d31dd21869fef3d717609221f8e42e0e57f3fd4fd0376fd8c3b3bf6b7702f
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Require exact final successful native, engine and startup runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/candidate work/reports out
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          expected=[
           (39459739308,'9fe2fd193a498e6103723d06ae2c4694e6b5326c','.github/workflows/android-native-build.yml'),
           (39459739185,'9fe2fd193a498e6103723d06ae2c4694e6b5326c','.github/workflows/beta8-validation.yml'),
           (39460536274,'f277c7d81bf9e9589e60537e9a1b29706a824f5d','.github/workflows/android-parallel-smoke.yml')]
          import os
          receipts=[]
          for run,sha,path in expected:
              obj=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+str(run)]))
              assert obj['id']==run and obj['conclusion']=='success' and obj['repository']['id']==1424927008
              assert obj['head_sha']==sha and obj['head_branch']=='beta8/fmv-rendering' and obj['path']==path
              receipts.append(dict(run=run,sha=sha,path=path,conclusion=obj['conclusion']))
          Path('work/reports/required-runs.json').write_text(json.dumps(receipts,indent=2)+'\n')
          PY
          gh run download 39460536274 --repo "$GITHUB_REPOSITORY" --name android-production-unsigned --dir work/candidate
          echo '28b4905bb5f9d3f59ab81db15ac009a82b8b9b83d04c99a47adbfa670865d754  work/candidate/ReRAC-1.1.0-beta.8-production-unsigned.apk' | sha256sum -c -
          sdkmanager 'build-tools;36.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-cryptography > /dev/null
      - name: Check rejection paths and reconstruct the exact original-signer APK
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s android/release/tests -p 'test_verify_signed_beta8.py' -v 2>&1 | tee work/reports/verification-tests.log
          python3 android/release/verify_signed_beta8.py --unsigned work/candidate/ReRAC-1.1.0-beta.8-production-unsigned.apk --approval android/release/beta8-public-approval.json --approval-sha256 "$APPROVAL_SHA256" --tools "$ANDROID_HOME/build-tools/36.0.0" --output out | tee work/reports/reconstruction.log
          git archive --format=tar.gz --output=out/ReRAC-Android-0.3.5-Launcher-1.1-beta8-source.tar.gz HEAD
          git rev-parse HEAD > out/source-commit.txt
          sha256sum out/*.tar.gz >> out/SHA256SUMS.txt
          git diff --check
      - name: Retain signed release candidate and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta8-signed-validation
          path: |
            out
            work/reports
          retention-days: 21
          if-no-files-found: error

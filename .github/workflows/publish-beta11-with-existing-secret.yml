name: Sign and publish beta11 using previously configured original certificate
on:
  push:
    branches: [fix/036-touch-and-companion]
    paths: [.github/workflows/publish-beta11-with-existing-secret.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: rerac-upstream036-beta11-development
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      sha256: ${{ steps.sign.outputs.sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_B64: ${{ secrets.RERAC_035_KEYSTORE_B64 }}
      RERAC_KEY_PASSWORD: ${{ secrets.RERAC_035_KEYSTORE_PASSWORD }}
      TAG: rerac-android-0.3.6-dev.2
      APK: ReRAC-Android-0.3.6-Launcher-1.1-beta11-DEV.apk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require preconfigured original signer, never fabricate a new certificate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$RERAC_KEY_PASSWORD" ]]; then
            echo "::error::Original offline signer is not configured as GitHub Actions secrets; beta11 remains unpublished."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Require final success for the corrected touchscreen source and Android startup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/candidate work/output work/proof work/downloaded
          for pair in '39507600973 .github/workflows/android-native-build.yml' '39507693858 .github/workflows/android-parallel-smoke.yml'; do
            read -r run path <<< "$pair"
            gh run watch "$run" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > "work/proof/$run.json"
            python3 - "$run" "$path" <<'PY'
          import json,sys
          d=json.load(open('work/proof/'+sys.argv[1]+'.json'))
          assert d['id']==int(sys.argv[1]) and d['path']==sys.argv[2]
          assert d['head_branch']=='fix/036-touch-and-companion' and d['conclusion']=='success'
          assert d['repository']['id']==1424927008
          PY
          done
          gh run download 39507693858 --repo "$GITHUB_REPOSITORY" --name android-production-unsigned --dir work/candidate
          gh run download 39507693858 --repo "$GITHUB_REPOSITORY" --name android-sidecar-smoke-evidence --dir work/proof/startup
          test "$(cat work/proof/startup/native-build-run.txt)" = '39507600973'
          test "$(cat work/proof/startup/result.txt)" = 'launcher_startup=passed'
          test "$(find work/candidate -name 'ReRAC-1.1.0-beta.11-production-unsigned.apk' | wc -l)" -eq 1
      - name: Sign pinned production APK and Development manifest with unchanged key
        id: sign
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sdkmanager 'build-tools;36.0.0'
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-cryptography >/dev/null
          key="$RUNNER_TEMP/rerac-existing-release-signer.p12"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$key"
          python3 - "$key" <<'PY'
          import hashlib,sys
          from pathlib import Path
          from cryptography.hazmat.primitives.serialization import pkcs12,Encoding
          _,cert,_=pkcs12.load_key_and_certificates(Path(sys.argv[1]).read_bytes(),__import__('os').environ['RERAC_KEY_PASSWORD'].encode())
          assert cert is not None
          assert hashlib.sha256(cert.public_bytes(Encoding.DER)).hexdigest()=='e2253eb7370c495ef0265efcdbe6bfbe09832070558fe9ed7047e7a2361ad75e'
          PY
          unsigned="work/candidate/ReRAC-1.1.0-beta.11-production-unsigned.apk"
          test -f "$unsigned"
          python3 - "$unsigned" <<'PY'
          import json,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as a:
              m=json.loads(a.read('assets/rerac-build.json'))
              assert (m['package_id'],m['core_version'],m['launcher_version'],m['version_code'])==('org.rerac.android.ui035test','0.3.6','1.1.0-beta.11',27)
              assert m['upstream_sha']=='89c87e98f9d8296187df2a6310c67b32144090d3'
              assert m['native_source_rebuild'] is True
              assert all('lib/'+abi+'/librc_engine.so' in a.namelist() for abi in ('arm64-v8a','x86_64'))
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --alignment-preserved --ks "$key" --ks-type PKCS12 --ks-pass env:RERAC_KEY_PASSWORD --v4-signing-enabled false --out "work/output/$APK" "$unsigned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "work/output/$APK" > work/proof/signature.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: e2253eb7370c495ef0265efcdbe6bfbe09832070558fe9ed7047e7a2361ad75e' work/proof/signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' work/proof/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "work/output/$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "work/output/$APK" > work/proof/manifest.txt
          grep -q "package: name='org.rerac.android.ui035test' versionCode='27' versionName='1.1.0-beta.11'" work/proof/manifest.txt
          python3 android/release/sign_035_feed.py --apk "work/output/$APK" --keystore "$key" --password-env RERAC_KEY_PASSWORD --release-tag "$TAG" --channel development --output work/output/development.json > work/proof/signed-feed.json
          rm -f "$key"
          sha256sum "work/output/$APK" > work/proof/apk-hash.txt
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          sha=hashlib.sha256(Path('work/output/ReRAC-Android-0.3.6-Launcher-1.1-beta11-DEV.apk').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('sha256='+sha+'\n')
          print('Exact signed beta11 APK SHA256',sha)
          PY
      - name: Confirm beta10 Development feed and unchanged Stable
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/development.json?ref=update-channel2" > work/proof/before-dev.json
          gh api "repos/$GITHUB_REPOSITORY/contents/stable.json?ref=update-channel2" > work/proof/before-stable.json
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          raw=json.loads(Path('work/proof/before-dev.json').read_text())
          release=json.loads(base64.b64decode(json.loads(base64.b64decode(raw['content']))['payload']))['release']
          assert release['version_code']==26 and release['core_version']=='0.3.6'
          PY
      - name: Publish signed beta11 APK and independently verify downloaded bytes
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release tag already exists: verify immutable APK instead of overwriting'
          else
            gh release create "$TAG" "work/output/$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title 'ReRAC Android 0.3.6 Development beta.11 — touch fixes' \
              --notes 'Repairs touch wrench throw and contextual Triangle at vendors/ships while preserving the original quick-select wheel, dual-screen mod and movie quality. Source-built 0.3.6, launcher beta.11/code27. Stable unchanged; owner AYN Thor validation pending.'
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$APK" --dir work/downloaded
          cmp "work/output/$APK" "work/downloaded/$APK"
      - name: Offer beta11 through the same signed Development channel
        shell: bash
        run: |
          set -euo pipefail
          before="$(python3 - <<'PY'
          import json
          print(json.load(open('work/proof/before-dev.json'))['sha'])
          PY
          )"
          current="$(gh api "repos/$GITHUB_REPOSITORY/contents/development.json?ref=update-channel2" --jq '.sha')"
          test "$current" = "$before"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/development.json" -f branch=update-channel2 \
             -f "sha=$before" -f "message=Offer verified ReRAC beta11 touch fixes through Development" \
             -f "content=$(base64 -w0 work/output/development.json)" > work/proof/published-dev.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/contents/stable.json?ref=update-channel2" --jq '.sha')" = "$(python3 - <<'PY'
          import json
          print(json.load(open('work/proof/before-stable.json'))['sha'])
          PY
          )"
      - name: Upload public verification logs (not signing credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta11-publication-proof
          path: work/proof
          retention-days: 14
          if-no-files-found: warn
  live-update:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.publish.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Download genuine signed beta10 for in-place updater
        run: |
          set -euo pipefail
          mkdir -p work/previous work/reports
          gh release download rerac-android-0.3.6-dev.1 --repo "$GITHUB_REPOSITORY" \
            --pattern 'ReRAC-Android-0.3.6-Launcher-1.1-beta10-DEV.apk' --dir work/previous
      - name: Prepare Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real beta10 to beta11 update, signed feed and Android install consent
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none
          script: python android/release/experimental_live_update_test.py --apk work/previous/ReRAC-Android-0.3.6-Launcher-1.1-beta10-DEV.apk --output work/reports --initial-code 26 --target-code 27 --target-version 1.1.0-beta.11 --target-sha256 "$TARGET_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta11-inlauncher-upgrade-proof
          path: work/reports
          if-no-files-found: warn
          retention-days: 14
